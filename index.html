<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yamaha Projects — Performance Dashboard</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --inset: #f4f6fb;
      --line: #e2e4ea;
      --line-soft: #eceef3;
      --text: #161616;
      --muted: #5c6370;
      --dim: #6b7280;
      --yamaha: #263692;
      --yamaha-line: #263692;
      --yamaha-wash: rgba(38, 54, 146, 0.1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    button, input { font-family: inherit; }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 28px 64px;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 3px solid var(--yamaha);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand img {
      height: 42px;
      width: auto;
      display: block;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 18px;
      border-left: 1px solid var(--line);
    }

    .brand-copy strong {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .brand-copy span,
    .period {
      color: var(--muted);
      font-size: 13px;
    }

    .period { text-align: right; }

    nav.tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      margin-top: 18px;
      border-bottom: 1px solid var(--line);
    }

    nav.tabs button {
      appearance: none;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 12px 16px 11px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    nav.tabs button:hover { color: var(--text); }

    nav.tabs button[aria-selected="true"] {
      color: var(--yamaha);
      background: var(--yamaha-wash);
      border-bottom-color: var(--yamaha);
    }

    nav.tabs button:focus-visible {
      outline: 2px solid var(--yamaha-line);
      outline-offset: -2px;
    }

    .note {
      margin: 14px 0 0;
      color: var(--dim);
      font-size: 12.5px;
    }

    .slide-title {
      margin: 34px 0 14px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px 24px 20px;
    }

    .card + .card,
    .block + .block { margin-top: 16px; }

    .kicker {
      margin: 0;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .subhead {
      margin: 8px 0 0;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
    }

    .filterbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--yamaha);
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pills button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .pills button:hover { border-color: var(--yamaha); color: var(--yamaha); }

    .pills button[aria-pressed="true"] {
      background: var(--yamaha);
      border-color: var(--yamaha);
      color: #fff;
    }

    .pills button:focus-visible {
      outline: 2px solid var(--yamaha);
      outline-offset: 2px;
    }

    .sample {
      margin-left: auto;
      color: var(--dim);
      font-size: 12.5px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .kpi {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px 12px;
      background: #fafbfe;
    }

    .kpi-label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .kpi-value {
      margin: 8px 0 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    .kpi-value.up, .num.up { color: #17663a; }
    .kpi-value.down, .num.down { color: #9f2d2d; }

    .kpi-note {
      margin: 6px 0 0;
      color: var(--dim);
      font-size: 13px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 40px;
      margin-top: 18px;
    }

    .col h3 {
      margin: 0;
      font-size: 16px;
    }

    .col .ask {
      margin: 4px 0 10px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .takeaways ul {
      margin: 0;
      padding-left: 18px;
    }

    .takeaways li { margin: 6px 0; }

    .meter { margin: 0 0 12px; }

    .meter-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .meter-top strong { font-variant-numeric: tabular-nums; }

    .track {
      margin-top: 6px;
      height: 6px;
      background: #e7e9f2;
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--yamaha);
      border-radius: 99px;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin: 22px 0 10px;
      font-size: 13.5px;
    }

    .chart-head span { color: var(--muted); }

    .chart-scroll { overflow-x: auto; }

    .chart {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: end;
    }

    .chart.wide {
      grid-template-columns: repeat(28, 52px);
      min-width: max-content;
    }

    .chart.years { grid-template-columns: repeat(3, 1fr); }

    .chart.m13 {
      grid-template-columns: repeat(13, 62px);
      min-width: max-content;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 2px;
      vertical-align: -1px;
    }

    .swatch.winter { background: #1b2748; }
    .swatch.spring { background: #2f6fed; }
    .swatch.offer { background: #b42318; }

    .act { display: block; font-size: 11px; }

    .bar-col {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: var(--dim);
      font-size: 12px;
      font-weight: 600;
    }

    .bar-val {
      display: block;
      text-align: center;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .bar-track {
      display: flex;
      align-items: flex-end;
      height: 92px;
      background: #f3f5fa;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      width: 100%;
      background: #c5cce8;
    }

    .bar-col.on .bar-fill { background: var(--yamaha); }
    .bar-col.winter .bar-fill { background: #1b2748; }
    .bar-col.spring .bar-fill { background: #2f6fed; }
    .bar-col.offer .bar-fill { background: #b42318; }
    .bar-col.on .bar-val,
    .bar-col.on { color: var(--yamaha); }

    .bar-name { display: block; text-align: center; margin-top: 6px; }

    .rank { list-style: none; margin: 12px 0 0; padding: 0; }

    .rank li {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 7px 0;
      border-top: 1px solid var(--line-soft);
      font-size: 14px;
    }

    .rank .n { color: var(--dim); font-variant-numeric: tabular-nums; }
    .rank .val { font-weight: 700; font-variant-numeric: tabular-nums; }

    .insight {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 13.5px;
    }

    .insight strong { color: var(--text); font-weight: 650; }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .inset {
      background: var(--inset);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 16px 16px 14px;
    }

    .inset .ico {
      color: var(--yamaha);
      margin-bottom: 10px;
    }

    .inset h3 {
      margin: 0;
      font-size: 16px;
    }

    .inset p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .inset .foot {
      margin-top: 12px;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 650;
    }

    .section-title {
      margin: 28px 0 12px;
      font-size: 18px;
      font-weight: 650;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--line);
    }

    th:nth-child(2), td:nth-child(2) {
      width: 88px;
      text-align: right;
      padding-right: 22px;
      font-variant-numeric: tabular-nums;
    }

    table.plain th:nth-child(2),
    table.plain td:nth-child(2) {
      width: auto;
      text-align: left;
      padding-right: 12px;
    }

    table.plain th:nth-child(3),
    table.plain td:nth-child(3),
    table.plain th:nth-child(4),
    table.plain td:nth-child(4) {
      width: 110px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-scroll { overflow-x: auto; }

    table.nums { font-size: 13px; }

    table.nums th,
    table.nums td {
      white-space: nowrap;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    table.nums th:nth-child(n + 3),
    table.nums td:nth-child(n + 3) {
      width: auto;
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding-left: 12px;
    }

    tr.pick td { background: #f4f6fb; }
    tr.total td { font-weight: 700; }

    .promo .stat {
      margin: 10px 0 0;
      font-size: 26px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    td {
      padding: 14px 12px 14px 0;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }

    td:first-child { font-weight: 650; white-space: nowrap; }

    .promos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .promo {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 16px 18px;
      background: #ffffff;
      min-height: 132px;
    }

    .promo .ico { color: var(--yamaha); margin-bottom: 12px; }

    .promo h3 {
      margin: 0;
      font-size: 16px;
    }

    .promo p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .takeaways li { color: var(--text); }

    svg { display: block; }

    @media (max-width: 720px) {
      .wrap { padding: 18px 16px 48px; }
      header.top { align-items: flex-start; flex-direction: column; gap: 12px; }
      .period { text-align: left; }
      .brand-copy { border-left: 0; padding-left: 0; }
      .kpis, .split, .pair, .promos { grid-template-columns: 1fr 1fr; gap: 12px; }
      .sample { margin-left: 0; }
      .chart { gap: 4px; }
      .kpi-value { font-size: 24px; }
      td:first-child { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <img src="yamaha-logo-mark.png" alt="Yamaha" />
        <div class="brand-copy">
          <strong>Projects Performance Dashboard</strong>
          <span>Seven program reviews in one pack</span>
        </div>
      </div>
      <div class="period" id="period-label">October 2026<br />Year-on-year growth</div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Yamaha projects" id="tabs"></nav>
    <div class="filterbar">
      <span class="filter-label">Month</span>
      <div class="pills" id="pills" role="group" aria-label="Month filter"></div>
      <span class="sample" id="sample">Sample data for review</span>
    </div>

    <div id="root"></div>
  </div>

  <script>
    const ICONS = {
      trophy: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4h8v3a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5A2.5 2.5 0 0 0 8 10"/><path d="M16 6h2.5A2.5 2.5 0 0 1 16 10"/><path d="M12 11v3"/><path d="M9 20h6"/><path d="M10 17h4l-1 3h-2l-1-3z"/></svg>',
      bars: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 19V10"/><path d="M12 19V5"/><path d="M19 19v-7"/></svg>',
      calendar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
      tag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v6l8.5 8.5a2 2 0 0 0 2.8 0l5.2-5.2a2 2 0 0 0 0-2.8L12 4z"/><circle cx="8.5" cy="8.5" r="1"/></svg>',
      handshake: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 13l2.2 2.2a2 2 0 0 0 2.8 0L16 12"/><path d="M4 12l3-3 3 2 3-4 3 2 4-2"/><path d="M3 15l3 3M21 15l-3 3"/></svg>'
    };

    const MONTHS = [
      { id: "2026-04", short: "Apr", name: "April 2026", ly: "April 2025" },
      { id: "2026-05", short: "May", name: "May 2026", ly: "May 2025" },
      { id: "2026-06", short: "Jun", name: "June 2026", ly: "June 2025" },
      { id: "2026-07", short: "Jul", name: "July 2026", ly: "July 2025" },
      { id: "2026-08", short: "Aug", name: "August 2026", ly: "August 2025" },
      { id: "2026-09", short: "Sep", name: "September 2026", ly: "September 2025" },
      { id: "2026-10", short: "Oct", name: "October 2026", ly: "October 2025", partial: true }
    ];

    const PERIODS = [
      { id: "fytd", label: "FY to date", name: "April–October 2026", ly: "April–October 2025", ids: MONTHS.map((m) => m.id) },
      { id: "q2", label: "Jul–Sep", name: "July–September 2026", ly: "July–September 2025", ids: ["2026-07", "2026-08", "2026-09"] },
      ...MONTHS.map((m) => ({ id: m.id, label: m.short, name: m.name, ly: m.ly, ids: [m.id], partial: !!m.partial }))
    ];

    const PROJECTS = [
      {
        id: "tie-up",
        tab: "Tie-Up",
        slide1: "Slide 1: Tie-Up — Performance & Partner Insights",
        slide2: "Slide 2: Partner Performance & Promotional Effectiveness",
        program: "Tie-Up Program",
        profile: "Partner & Model Profile",
        activation: "Partner Performance & Activation",
        unit: "placements",
        lifetimeBase: 1240,
        lifetimeLabel: "Total tie-ups to date",
        periodLabel: "Placements in period",
        volume: [[86, 72], [94, 78], [110, 81], [128, 90], [142, 96], [136, 101], [74, 88]],
        leftTitle: "Tie-Up Partner Type",
        leftAsk: "Which partners are driving placements?",
        left: ["Corporate and institutional", "Campus and community", "Fleet and bulk buyers"],
        leftW: [[0.44, 0.34, 0.22], [0.42, 0.35, 0.23], [0.40, 0.33, 0.27], [0.38, 0.31, 0.31], [0.35, 0.29, 0.36], [0.37, 0.30, 0.33], [0.43, 0.34, 0.23]],
        rightTitle: "Yamaha Model Placed",
        rightAsk: "Which bikes move through the tie-up?",
        rightNoun: "model group",
        right: ["FZS and commuter", "R15 and premium sport", "RayZR and scooter"],
        rightW: [[0.50, 0.30, 0.20], [0.48, 0.32, 0.20], [0.46, 0.34, 0.20], [0.44, 0.36, 0.20], [0.40, 0.40, 0.20], [0.42, 0.38, 0.20], [0.47, 0.33, 0.20]],
        topTitle: "Top-performing partners",
        topFoot: "Top 5 partner accounts",
        top: ["Grameenphone Fleet", "BRAC University", "Square Group", "Dhaka College", "Banglalink Corporate"],
        topW: [0.19, 0.15, 0.12, 0.10, 0.08],
        lowTitle: "Low / non-performing partners",
        low: ["North City Campus", "Riverside Fleet", "Old Town Institute", "West End Tie-up", "Harbor Campus"],
        lowCounts: [[2, 1, 1, 0, 0], [1, 2, 0, 1, 0], [2, 1, 0, 0, 1], [1, 1, 2, 0, 0], [0, 1, 1, 2, 0], [1, 0, 2, 1, 0], [1, 0, 0, 1, 2]],
        classTitle: "Partner Performance Classification",
        classHigh: "Strong placement volume and regular activity",
        classLow: "Very low volume for the length of the period",
        classNone: "Zero placements during the selected period",
        promos(current, months) {
          const events = Math.max(months, Math.round(current / 24));
          return [
            ["calendar", "Joint activations", fmt(events), Math.min(8, Math.max(2, Math.round(current / 40))) + " cities · " + fmt(Math.round(current * 1.15)) + " enquiries"],
            ["tag", "Co-branded offers", fmt(Math.round(current * 0.47)), "Claims logged in the period"],
            ["handshake", "Partner support", bdt(current * 4600), Math.max(6, Math.round(current / 7)) + " partners responded"]
          ];
        },
        closing(current) {
          return "Co-branded claims were " + fmt(Math.round(current * 0.47)) + " against " + fmt(current) + " placements. Check cost per placement before extending the offer.";
        }
      },
      {
        id: "local-mechanics",
        tab: "Local Mechanics",
        slide1: "Slide 1: Local Mechanics — Performance & Workshop Insights",
        slide2: "Slide 2: Workshop Performance & Support Effectiveness",
        program: "Local Mechanics Program",
        profile: "Workshop & Service Profile",
        activation: "Workshop Performance & Activation",
        unit: "jobs",
        lifetimeBase: 8640,
        lifetimeLabel: "Mechanics enrolled to date",
        lifetimeValue: 612,
        periodLabel: "Jobs and parts lines",
        volume: [[410, 355], [438, 370], [462, 388], [510, 402], [548, 420], [536, 431], [390, 410]],
        leftTitle: "Mechanic Network",
        leftAsk: "Who is active in the program?",
        left: ["Independent workshop owners", "Multi-brand service points", "Yamaha-focused mechanics"],
        leftW: [[0.46, 0.32, 0.22], [0.44, 0.33, 0.23], [0.42, 0.32, 0.26], [0.40, 0.31, 0.29], [0.38, 0.30, 0.32], [0.39, 0.30, 0.31], [0.43, 0.33, 0.24]],
        rightTitle: "Service & Parts Mix",
        rightAsk: "What work is coming through the network?",
        rightNoun: "service line",
        right: ["General service", "Genuine parts attached", "Repeat workshop jobs"],
        rightW: [[0.48, 0.30, 0.22], [0.46, 0.32, 0.22], [0.44, 0.33, 0.23], [0.42, 0.34, 0.24], [0.40, 0.36, 0.24], [0.41, 0.35, 0.24], [0.45, 0.33, 0.22]],
        topTitle: "Top-performing workshops",
        topFoot: "Top 5 mechanic points",
        top: ["Gulshan Bike Care", "Mirpur Two-Wheeler", "Uttara Moto House", "Chittagong Workshop 4", "Sylhet Gear Point"],
        topW: [0.16, 0.13, 0.11, 0.09, 0.08],
        lowTitle: "Low / non-performing workshops",
        low: ["Barisal Lane Garage", "Rangpur Multi-brand", "Khulna Old Stand", "Jamalpur Cycle", "Pabna Corner Shop"],
        lowCounts: [[2, 2, 1, 0, 0], [1, 2, 1, 1, 0], [2, 1, 0, 0, 1], [1, 1, 2, 0, 0], [0, 2, 1, 1, 0], [1, 0, 2, 1, 0], [1, 0, 0, 0, 1]],
        classTitle: "Workshop Performance Classification",
        classHigh: "Strong job volume and regular genuine-parts offtake",
        classLow: "Very low job count for the length of the period",
        classNone: "Zero jobs during the selected period",
        promos(current, months) {
          const camps = Math.max(months, Math.round(current / 180));
          return [
            ["calendar", "Training camps", fmt(camps), fmt(Math.round(current * 0.35)) + " mechanics attended"],
            ["tag", "Parts schemes", fmt(Math.round(current * 0.62)), "Genuine-parts lines in the period"],
            ["handshake", "Mechanic incentives", bdt(current * 850), Math.max(20, Math.round(current / 12)) + " workshops responded"]
          ];

    function viewFor(project, period) {
      const indexes = period.ids.map((id) => MONTHS.findIndex((m) => m.id === id));
      const left = project.left.map(() => 0);
      const right = project.right.map(() => 0);
      const top = project.top.map(() => 0);
      const low = project.low.map(() => 0);
      let current = 0;
      let last = 0;
      indexes.forEach((i) => {
        current += project.volume[i][0];
        last += project.volume[i][1];
        distribute(project.volume[i][0], project.leftW[i]).forEach((n, k) => { left[k] += n; });
        distribute(project.volume[i][0], project.rightW[i]).forEach((n, k) => { right[k] += n; });
        project.topW.forEach((w, k) => { top[k] += Math.round(project.volume[i][0] * w); });
        project.lowCounts[i].forEach((n, k) => { low[k] += n; });
      });
      const lifetime = project.lifetimeValue != null
        ? project.lifetimeValue
        : project.lifetimeBase + project.volume.reduce((sum, row) => sum + row[0], 0);
      const growth = last === 0 ? 0 : ((current - last) / last) * 100;
      return { current, last, left, right, top, low, lifetime, growth, months: indexes.length };
    }

    function meters(names, values) {
      const max = Math.max(...values, 1);
      return names.map((name, i) => `
        <div class="meter">
          <div class="meter-top"><span>${name}</span><strong>${fmt(values[i])}</strong></div>
          <div class="track"><div class="fill" style="width:${Math.round((values[i] / max) * 100)}%"></div></div>
        </div>`).join("");
    }

    function ranks(names, values, asc) {
      const rows = names.map((name, i) => ({ name, value: values[i] }));
      rows.sort((a, b) => asc ? a.value - b.value : b.value - a.value);
      return `<ol class="rank">${rows.map((row, i) => `
        <li><span class="n">${i + 1}</span><span>${row.name}</span><span class="val">${fmt(row.value)}</span></li>`).join("")}</ol>`;
    }

              <div class="kpi">
                <p class="kpi-label">${project.lifetimeLabel}</p>
                <p class="kpi-value">${fmt(view.lifetime)}</p>
                <p class="kpi-note">Since program launch</p>
              </div>
              <div class="kpi">
                <p class="kpi-label">${period.name}</p>
                <p class="kpi-value">${fmt(view.current)}</p>
                <p class="kpi-note">${period.partial ? note : project.periodLabel}</p>
              </div>
              <div class="kpi">
                <p class="kpi-label">${period.ly}</p>
                <p class="kpi-value">${fmt(view.last)}</p>
                <p class="kpi-note">Comparable period</p>
              </div>
              <div class="kpi">
                <p class="kpi-label">YoY growth</p>
                <p class="kpi-value ${up ? "up" : "down"}">${growthText}</p>
                <p class="kpi-note">Versus last year</p>
              </div>
            </div>
            <div class="chart-head"><strong>${project.periodLabel} by month</strong><span>April–October 2026 · click a month</span></div>
            <div class="chart">${bars}</div>
          </article>

          <article class="card block">
            <h3 class="section-title" style="margin-top:0">${project.profile}</h3>
            <div class="split">
              <div class="col">
                <h3>${project.leftTitle}</h3>
                <p class="ask">${project.leftAsk}</p>
                ${meters(project.left, view.left)}
              </div>
              <div class="col">
                <h3>${project.rightTitle}</h3>
                <p class="ask">${project.rightAsk}</p>
                ${meters(project.right, view.right)}
              </div>
            </div>
            <p class="insight"><strong>Key insight:</strong> ${leadLeft.name} led with ${fmt(leadLeft.value)} ${project.unit}. ${leadRight.name} led the ${project.rightNoun} mix, at ${rightShare}% of the period.</p>
          </article>

          <h2 class="slide-title">${project.slide2}</h2>
          <article class="card">
            <h3 class="kicker">${project.activation}</h3>
            <div class="pair">
              <div class="inset">
                <div class="ico">${ICONS.trophy}</div>
                <h3>${project.topTitle}</h3>
                <p>Highest volume, contribution and consistency.</p>
                ${ranks(project.top, view.top, false)}
                <div class="foot">${project.topFoot}</div>
              </div>
              <div class="inset">
                <div class="ico">${ICONS.bars}</div>
                <h3>${project.lowTitle}</h3>
                <p>Watch list, lightest activity first.</p>
                ${ranks(project.low, view.low, true)}
                <div class="foot">${noneN} at zero in this period</div>
              </div>
            </div>
          </article>

          <h3 class="section-title">${project.classTitle}</h3>
          <table>
            <thead><tr><th>Category</th><th>Tracked</th><th>Suggested assessment</th></tr></thead>
            <tbody>
              <tr><td>High performer</td><td>${highN}</td><td>${project.classHigh}</td></tr>
              <tr><td>Low performer</td><td>${lowN}</td><td>${project.classLow}</td></tr>
              <tr><td>Non-performer</td><td>${noneN}</td><td>${project.classNone}</td></tr>
            </tbody>
          </table>

          <h3 class="section-title">Promotional Activities & Support</h3>
          <div class="promos">${promo}</div>

          <h3 class="section-title">Management Takeaways</h3>
          <div class="takeaways"><ul>
            <li>${topRows[0].name} led with ${fmt(topRows[0].value)} ${project.unit}. Carry that pattern to the next accounts.</li>
            <li>${quiet}</li>
            <li>${compare}</li>
            <li>${project.closing(view.current)}</li>
          </ul></div>
        </section>`;
    }

    tabs.innerHTML = PROJECTS.map((project) =>
      `<button role="tab" id="tab-${project.id}" type="button" aria-selected="false">${project.tab}</button>`
    ).join("");

    function renderPills() {
      const list = projectId === "exchange"
        ? EX_PERIODS.filter((period) => period.pin)
        : projectId === "apparels"
          ? AP_PERIODS.filter((period) => period.pin)
          : PERIODS;
      pills.innerHTML = list.map((period) =>
        `<button type="button" data-period="${period.id}" aria-pressed="false">${period.label}</button>`
      ).join("");
      const sample = document.getElementById("sample");
      sample.textContent = projectId === "exchange"
        ? "Exchange figures from the review report"
        : projectId === "apparels"
          ? "Apparel figures from the review report"
          : "Sample data for review";
    }

    function selectProject(id) {
      projectId = id;
      if (id === "exchange" || id === "apparels") {
        const pinned = activePeriods().some((period) => period.pin && period.id === periodId);
        if (!pinned) periodId = "all";
      } else if (!PERIODS.some((period) => period.id === periodId)) {
        periodId = "2026-10";
      }
      PROJECTS.forEach((project) => {
        const on = project.id === id;
        const button = document.getElementById("tab-" + project.id);
        button.setAttribute("aria-selected", on ? "true" : "false");
        button.tabIndex = on ? 0 : -1;
      });
      renderPills();
      selectPeriod(periodId);
    }

    function selectPeriod(id) {
      periodId = id;
      document.querySelectorAll("#pills [data-period]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.period === id ? "true" : "false");
      });
      renderView();
    }

    tabs.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      selectProject(button.id.replace("tab-", ""));
    });

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("[data-period]");
      if (!button || button.closest("#tabs")) return;
      selectPeriod(button.dataset.period);
    });

    const fromHash = location.hash.replace("#", "");
    periodId = "2026-10";
    selectProject(PROJECTS.some((project) => project.id === fromHash) ? fromHash : "tie-up");
  </script>
</body>
</html>
